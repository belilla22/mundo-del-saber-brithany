<script>

/* =========================
   SONIDOS
========================= */

let audioContext=null;

function obtenerAudio(){

  if(!audioContext){

    audioContext=
      new(window.AudioContext ||
      window.webkitAudioContext)();

  }

  if(audioContext.state==="suspended"){
    audioContext.resume();
  }

  return audioContext;
}


function tono(frecuencia,duracion,tipo="sine"){

  try{

    const audio=obtenerAudio();

    const oscilador=
      audio.createOscillator();

    const ganancia=
      audio.createGain();

    oscilador.type=tipo;
    oscilador.frequency.value=frecuencia;

    ganancia.gain.setValueAtTime(
      0.0001,
      audio.currentTime
    );

    ganancia.gain.exponentialRampToValueAtTime(
      0.06,
      audio.currentTime+0.01
    );

    ganancia.gain.exponentialRampToValueAtTime(
      0.0001,
      audio.currentTime+duracion
    );

    oscilador.connect(ganancia);
    ganancia.connect(audio.destination);

    oscilador.start();
    oscilador.stop(
      audio.currentTime+duracion+0.02
    );

  }catch(e){}
}


/* CLIC */

function sonidoClick(){

  tono(520,.06,"square");

}


/* CORRECTA */

function sonidoCorrecta(){

  tono(660,.09);
  setTimeout(()=>tono(880,.13),90);

}


/* INCORRECTA */

function sonidoIncorrecta(){

  tono(180,.12,"sawtooth");
  setTimeout(()=>tono(120,.16,"sawtooth"),100);

}


/* FINAL */

function sonidoFinal(){

  tono(523,.08);
  setTimeout(()=>tono(659,.08),80);
  setTimeout(()=>tono(784,.16),160);

}


/* =========================
   NAVEGACIÓN
========================= */

function mostrar(id){

  document
    .querySelectorAll("section")
    .forEach(s=>s.classList.add("hide"));

  document
    .getElementById(id)
    .classList.remove("hide");

  window.scrollTo(0,0);

}


/* =========================
   DATOS
========================= */

const materias={

["7 - 2 = ?",["6","4","5"],2],

["4 + 5 = ?",["8","9","7"],1],

["10 - 3 = ?",["6","8","7"],2],

["6 + 6 = ?",["11","12","13"],1],

["9 - 5 = ?",["3","5","4"],2],

["3 + 7 = ?",["9","10","11"],1],

["8 - 4 = ?",["4","3","5"],0],

["5 + 6 = ?",["10","12","11"],2],

["12 - 7 = ?",["4","6","5"],2]

]

},


ingles:{

icono:"🇬🇧",

preguntas:[

["¿Cómo se dice «Hola»?",
["Hello","Goodbye","Please"],0],

["¿Cómo se dice «Gracias»?",
["Sorry","Thank you","Hello"],1],

["¿Cómo se dice «azul»?",
["Blue","Green","Yellow"],0],

["¿Cómo se dice «perro»?",

["¿Cómo se dice «rojo»?",

["¿Cómo se dice «cinco»?",

]

},


cultura:{

preguntas:[

["¿En qué planeta vivimos?",

["¿Cuántos días tiene una semana?",

["¿Cuál es un animal?",

["¿Qué usamos para escribir?",

["¿Qué animal dice «miau»?",

},

preguntas:[

/* =========================
   ABRIR MATERIA
========================= */

function abrirMateria(materia){

  sonidoClick();

  if(materia==="lectura"){

    abrirLectura();

    return;

  }

  const datos=materias[materia];

  document.getElementById("titulo").textContent=
    datos.icono+" "+datos.nombre;

  document.getElementById("puntuacion").textContent=
    "Puntuación: 0 / "+datos.preguntas.length;

  const contenido=
    document.getElementById("contenido");

  contenido.innerHTML="";

  datos.preguntas.forEach((pregunta,indice)=>{

    const caja=
      document.createElement("div");

    caja.className="question";

    caja.dataset.respondida="no";

    let html=
      "<p>"+(indice+1)+". "+
      pregunta[0]+"</p>";

    pregunta[1].forEach((respuesta,posicion)=>{

      html+=
      `<button class="answer"
      onclick="responder(
      this,
      ${posicion===pregunta[2]},
      ${indice},
      ${datos.preguntas.length}
      )">
      ${respuesta}
      </button>`;

    });

    html+=
      '<div class="feedback"></div>';

    caja.innerHTML=html;

    contenido.appendChild(caja);

  });

  document.getElementById("actividad").dataset.puntos="0";

  mostrar("actividad");

}


/* =========================
   RESPUESTAS
========================= */

function responder(
  boton,
  correcta,
  indice,
  total
){

  const caja=boton.parentElement;

  if(caja.dataset.respondida==="si"){
    return;
  }

  caja.dataset.respondida="si";

  const botones=
    caja.querySelectorAll(".answer");

  botones.forEach(b=>b.disabled=true);

  const feedback=
    caja.querySelector(".feedback");


  if(correcta){

    boton.classList.add("correct");

    let puntos=
      Number(
        document.getElementById("actividad")
        .dataset.puntos
      )+1;

    document.getElementById("actividad")
      .dataset.puntos=puntos;

    feedback.textContent=
      "🌟 ¡Correcto! ¡Muy bien!";

    sonidoCorrecta();

  }else{

    boton.classList.add("wrong");

    feedback.textContent=
      "💡 No pasa nada. ¡Sigue aprendiendo!";

    sonidoIncorrecta();

  }


  const puntos=
    Number(
      document.getElementById("actividad")
      .dataset.puntos
    );

  document.getElementById("puntuacion")
    .textContent=
    "Puntuación: "+
    puntos+
    " / "+
    total;


  const respondidas=
    document.querySelectorAll(
      ".question[data-respondida='si']"
    ).length;


  if(respondidas===total){

    setTimeout(()=>{

      sonidoFinal();

      feedback.textContent +=
        " 🎉 ¡Actividad terminada!";

    },300);

  }

}


/* =========================
   LECTURA
========================= */

function abrirLectura(){

  document.getElementById("titulo").textContent=
    "📖 MUNDO 2 · LECTURA";

  document.getElementById("puntuacion").textContent=
    "Lee el cuento y responde";

  document.getElementById("contenido").innerHTML=`

    <div class="question">

      <h2>🐰 El conejito Alfonso</h2>

      <div class="story">

        Alfonso era un conejito muy curioso
        y alegre. Era hermano de Brithany.

        Una mañana encontró una zanahoria
        enorme y decidió guardarla para la cena.

        Mientras jugaba, dejó la zanahoria
        junto a un árbol.

        Cuando regresó, ya no estaba.

        Alfonso siguió unas pequeñas huellas
        y encontró su zanahoria junto a una
        ardilla.

        La ardilla la había movido para que
        no se mojara con la lluvia.

        Alfonso se puso muy contento y
        compartió la zanahoria con ella.

      </div>

      <button
        class="btn yellow"
        onclick="leerCuento()">

        🔊 ESCUCHAR CUENTO

      </button>

      <p>
        ¿Cómo se llamaba el conejito?
      </p>

      <button
        class="answer"
        onclick="responderLectura(this,true)">

        Alfonso

      </button>

      <button
        class="answer"
        onclick="responderLectura(this,false)">

        Tomás

      </button>

      <button
        class="answer"
        onclick="responderLectura(this,false)">

        Pedro

      </button>

      <div class="feedback"></div>

    </div>

  `;

  mostrar("actividad");

}


/* =========================
   SONIDO DE LECTURA
========================= */

function leerCuento(){

  sonidoClick();

  if(!("speechSynthesis" in window)){
    return;
  }

  speechSynthesis.cancel();

  const texto=
  "Alfonso era un conejito muy curioso y alegre. "+
  "Era hermano de Brithany. "+
  "Una mañana encontró una zanahoria enorme "+
  "y decidió guardarla para la cena. "+
  "Mientras jugaba dejó la zanahoria junto a un árbol. "+
  "Cuando regresó ya no estaba. "+
  "Alfonso siguió unas pequeñas huellas "+
  "y encontró su zanahoria junto a una ardilla. "+
  "La ardilla la había movido para que no se mojara "+
  "con la lluvia. "+
  "Alfonso se puso muy contento y compartió "+
  "la zanahoria con ella.";

  const voz=
    new SpeechSynthesisUtterance(texto);

  voz.lang="es-ES";
  voz.rate=.9;

  speechSynthesis.speak(voz);

}


/* =========================
   RESPUESTA LECTURA
========================= */

function responderLectura(boton,correcta){

  const caja=boton.parentElement;

  if(caja.dataset.respondida==="si"){
    return;
  }

  caja.dataset.respondida="si";

  caja.querySelectorAll(".answer")
    .forEach(b=>b.disabled=true);

  const feedback=
    caja.querySelector(".feedback");

  if(correcta){

    boton.classList.add("correct");

    feedback.textContent=
      "🌟 ¡Correcto! Alfonso es el hermano de Brithany.";

    sonidoCorrecta();

  }else{

    boton.classList.add("wrong");

    feedback.textContent=
      "💡 Inténtalo otra vez en la próxima actividad.";

    sonidoIncorrecta();

  }

}
