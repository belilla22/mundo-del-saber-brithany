<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brithany · Mundo del Saber</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#071a3d;color:#fff}
#app{max-width:980px;margin:auto}
.screen{min-height:100vh;padding:16px;position:relative;overflow:hidden}
.home{background:linear-gradient(180deg,#061536 0%,#0b2858 55%,#123b72 100%)}
.study{background:radial-gradient(circle at 12% 12%,#2563eb 0 7%,transparent 20%),radial-gradient(circle at 88% 18%,#e94b9b 0 6%,transparent 18%),radial-gradient(circle at 18% 88%,#2fbf71 0 7%,transparent 19%),linear-gradient(145deg,#061536 0%,#0b2858 58%,#123b72 100%)}
.content{position:relative;z-index:2}
.logo{text-align:center;font-weight:1000;font-size:clamp(30px,6vw,56px);line-height:.9;padding:12px 4px 6px;letter-spacing:-2px;text-shadow:3px 4px 0 #fff,6px 7px 0 #1763bd;color:#fff}
.logo span{display:inline-block;color:#ffd21a;font-size:.72em;text-shadow:3px 3px 0 #1763bd}
.family{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.family span{padding:8px 14px;border-radius:999px;color:#fff;font-weight:950;box-shadow:0 4px 0 #0002}
.family .dad{background:#22a94b}.family .mom{background:#ef4b9b}
.card{background:linear-gradient(145deg,#ffffff,#f4fbff);color:#46354d;border:5px solid #fff;border-radius:28px;padding:18px;margin-top:14px;box-shadow:0 9px 0 #1763bd55,0 14px 28px #0002}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.subject{border:5px solid #fff;border-radius:26px;padding:18px;background:linear-gradient(145deg,#ffb400,#ff5a32);color:#fff;text-align:left;font-weight:1000;font-size:19px;box-shadow:0 8px 0 #b73b25,0 12px 22px #0002;cursor:pointer}
.subject:nth-child(2){background:linear-gradient(145deg,#6dd34e,#1aa84c);box-shadow:0 8px 0 #16753a,0 12px 22px #0002}
.subject:nth-child(3){background:linear-gradient(145deg,#9a56e8,#6240c5);box-shadow:0 8px 0 #43298f,0 12px 22px #0002}
.subject:nth-child(4){background:linear-gradient(145deg,#2ec5ed,#087fc8);box-shadow:0 8px 0 #075991,0 12px 22px #0002}
.subject:nth-child(5){background:linear-gradient(145deg,#ff77b5,#e93476);box-shadow:0 8px 0 #9c1d4d,0 12px 22px #0002}
.subject:nth-child(6){background:linear-gradient(145deg,#ffcf45,#ff8b21);box-shadow:0 8px 0 #b85b12,0 12px 22px #0002}
.subject small{display:block;margin-top:7px;color:#fff;font-weight:750;font-size:13px}
.btn,.opt{width:100%;padding:15px;border-radius:20px;margin-top:10px;font-size:16px;font-weight:950}
.btn{border:0;box-shadow:0 5px 0 #0002;cursor:pointer}
.primary{background:#ffd21a;color:#7b3c00;border:3px solid #fff}
.secondary{background:#087fc8;color:#fff;border:3px solid #fff}
.opt{border:4px solid #fff;background:#f7fbff;color:#46354d;text-align:left;box-shadow:0 5px 0 #b8c9d8;cursor:pointer}
.opt.correct{background:#c9f7d9;border-color:#34a963;box-shadow:0 5px 0 #208348}
.opt.wrong{background:#ffd4d4;border-color:#df5555;box-shadow:0 5px 0 #a93636}
.badge{display:inline-block;background:#fff0a5;color:#654d12;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:950;margin:3px;border:2px solid #fff}
.progress{height:14px;background:#ffffff66;border-radius:99px;overflow:hidden;margin:12px 0;border:2px solid #fff}
.progress i{display:block;height:100%;background:#ffd21a}
.reading{background:linear-gradient(145deg,#fffef7,#eaf8ff);color:#46354d;border-radius:22px;border:4px solid #8ed8ff;padding:20px;line-height:1.65;font-size:18px;margin-top:12px}
.feedback{border-radius:20px;padding:14px;margin-top:12px;font-weight:950;text-align:center;border:3px solid #fff}
.ok{background:#c9f7d9;color:#235d39}.bad{background:#ffd4d4;color:#7b3030}
.sound-note{font-size:13px;color:#756475;margin-top:8px;font-weight:750}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.logo{font-size:34px}}

.welcome-card{background:linear-gradient(135deg,#ffffff,#e8f7ff);border:5px solid #fff;border-radius:30px;margin-top:12px;padding:10px;box-shadow:0 9px 0 #0002}
.welcome-art{display:flex;align-items:center;justify-content:center;gap:18px;min-height:135px}
.avatar{width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;border:5px solid #fff;box-shadow:0 6px 0 #0002}
.dad-avatar{background:#67b7ff}.mom-avatar{background:#ff83c1}
.welcome-center{text-align:center;color:#21456e}
.welcome-center h1{margin:4px 0;font-size:clamp(24px,5vw,38px);color:#ff6b3d}
.welcome-center p{margin:4px 0;font-weight:900;font-size:16px}.welcome-stars{font-size:22px}
.motto{display:inline-block;margin:12px auto 2px;padding:9px 18px;border-radius:999px;background:#f05a9d;color:#fff;font-weight:1000;box-shadow:0 5px 0 #a72d67}
.subject b{display:block;margin-top:10px;font-size:14px}
.progress-card{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.progress-card .progress{flex:1;min-width:180px}
.home-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.tool{border:3px solid #fff;border-radius:20px;background:#ffffff22;color:#fff;padding:12px;font-size:24px;font-weight:950;box-shadow:0 5px 0 #0002}
.tool small{display:block;font-size:11px;margin-top:4px}
.footer-note{text-align:center;font-weight:900;margin:18px 0 5px;color:#fff}
@media(max-width:520px){.welcome-art{gap:6px}.avatar{width:64px;height:64px;font-size:40px}.home-tools{grid-template-columns:repeat(2,1fr)}}

let state={subject:0,zone:0,task:0,points:0,correct:0,total:0,answered:false,chosen:null,speechCount:0,failed:[]};
const app=document.getElementById("app");




function welcomeApplause(){
 try{
  const a=document.getElementById("welcomeAudio");
  if(!a)return;
  a.currentTime=0;
  const p=a.play();
  if(p&&p.catch)p.catch(()=>{});
 }catch(e){}
}
function tone(kind){
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),p={ok:[1047,1319],bad:[180,120],star:[880,1175,1568],finish:[659,880,1175,1568]}[kind]||[1047,1319];p.forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.1;o.type=kind==="bad"?"square":"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.2)})}catch(e){}
}
function say(msg){try{if(!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(msg);u.lang="es-ES";u.rate=1.05;u.pitch=1.28;speechSynthesis.speak(u)}catch(e){}}
function home(){
 app.innerHTML=`<button class="sound-badge" onclick="welcomeApplause()">🔊 Activar sonido</button><div class="cover-screen">
   <div class="cover-image" aria-label="Portada Brithany Mundo del Saber"></div>
   <div class="cover-hotspots">
     ${DATA.map((sub,i)=>`<button class="hotspot subject-hotspot subject-${i}" aria-label="${sub.name}" onclick="openSubject(${i})"></button>`).join("")}
   </div>
   <div class="exercise-launcher">
     <div class="launcher-title">📚 ELIGE TU ACTIVIDAD</div>
     <div class="launcher-grid">
       ${DATA.map((sub,i)=>`<button class="launcher-btn launcher-${i}" onclick="openSubject(${i})">${sub.icon} ${sub.name}<span>EMPEZAR →</span></button>`).join("")}
     </div>
   </div>
 </div>`;
}
function openSubject(i){state.subject=i;state.zone=0;state.task=0;zones()}
function zones(){
 const s=DATA[state.subject];
 app.innerHTML=`<div class="screen study"><div class="content"><button class="btn secondary" onclick="home()">← Asignaturas</button>
 <div class="card"><h1>${s.icon} ${s.name}</h1><p>${s.desc}</p>${s.zones.map((z,i)=>`<button class="btn primary" onclick="startZone(${i})">📘 ${z.name}<br><small>${z.tasks.length} actividades</small></button>`).join("")}</div></div></div>`;
}
function startZone(z){state.zone=z;state.task=0;state.answered=false;state.chosen=null;state.failed=[];renderTask()}
function renderTask(){
 const z=DATA[state.subject].zones[state.zone],a=z.tasks[state.task];
 let body="";
 if(a[5]==="reading") body=`<div class="reading">${a[2]}</div><div class="study-note">📖 Lee el texto con calma. Cuando termines, pulsa “Ya lo he leído”.</div><button class="btn primary" onclick="next()">➡️ Ya lo he leído</button>`;
 else body=a[3].map((o,i)=>`<button class="opt ${state.answered&&state.chosen===i?(i===a[4]?"correct":"wrong"):""}" ${state.answered?"disabled":""} onclick="answer(${i})">${o}</button>`).join("");
 app.innerHTML=`<div class="screen study"><div class="content"><button class="btn secondary" onclick="zones()">← Volver</button>
 <span class="badge">⭐ ${state.points}</span><span class="badge">✅ ${state.correct}/${state.total}</span>
 <div class="progress"><i style="width:${Math.round(state.task/z.tasks.length*100)}%"></i></div>
 <div class="card"><span class="badge">${a[0]} ${a[1]}</span>${a[5]==="reading"?`<h2>📖 Lee y comprende</h2>`:`<h2>${a[2]}</h2>`}${body}
 ${state.answered?`${state.chosen===a[4]?(
 state.task===z.tasks.length-1 && !state.failed.length
 ? `<div class="success-panel"><div class="success-stars">⭐ ✨ ⭐</div><strong>🎉 ¡Muy bien, felicidades!</strong><span>Has terminado esta lección.</span></div>`
 : `<div class="feedback ok">✅ Respuesta correcta</div>`
):`<div class="feedback bad">❌ Vamos a recordarlo y después lo intentamos de nuevo.</div>`}
<button class="btn primary" onclick="next()">${state.task===z.tasks.length-1?(state.failed.length?"🔁 Revisar errores":(state.subject<DATA.length-1?"📚 Siguiente asignatura →":"🏆 Terminar")):"➡️ Siguiente"}</button>`:""}
 </div></div></div>`;
}
function answer(i){
 if(state.answered)return;
 const a=DATA[state.subject].zones[state.zone].tasks[state.task];
 state.chosen=i;state.answered=true;state.total++;
 const ok=i===a[4];
 if(ok){
   state.correct++;state.points+=10;tone("ok");
 }else{
   tone("bad");
   if(!state.failed.includes(state.task)) state.failed.push(state.task);
 }
 renderTask();
}

function next(){
 const subject=DATA[state.subject], z=subject.zones[state.zone];

 if(state.task<z.tasks.length-1){
   state.task++;state.answered=false;state.chosen=null;renderTask();
   return;
 }

 // The first pass is complete. Revisit every missed question.
 if(state.failed.length){
   state.task=state.failed.shift();
   state.answered=false;state.chosen=null;
   renderTask();
   return;
 }

 // Only after every missed question has been answered correctly can we continue.
 tone("finish");
 const nextZone=state.zone+1;
 if(nextZone<subject.zones.length){
   state.zone=nextZone;state.task=0;state.answered=false;state.chosen=null;state.failed=[];
   setTimeout(renderTask,450);
 }else if(state.subject<DATA.length-1){
   state.subject++;state.zone=0;state.task=0;state.answered=false;state.chosen=null;state.failed=[];
   setTimeout(renderTask,450);
 }else{
   setTimeout(home,450);
 }
}

function startSpeech(target,seconds){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){alert("Este navegador no tiene reconocimiento de voz. Prueba con Chrome.");return}
 const r=new R();r.lang="es-ES";r.continuous=true;r.interimResults=false;state.speechCount=0;
 app.querySelector("#spoken").textContent="🎤 Escuchando…";
 r.onresult=e=>{let n=0;for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)n+=e.results[i][0].transcript.trim().split(/\s+/).filter(Boolean).length;state.speechCount+=n;app.querySelector("#spoken").textContent=`🎤 Palabras reconocidas: ${state.speechCount} / ${target}`;if(state.speechCount>=target){r.stop();tone("star");say("¡Muy bien, campeona!");}};
 r.onerror=()=>app.querySelector("#spoken").textContent="🎤 No pude reconocer la voz. Puedes repetir sin perder puntos.";
 r.start();setTimeout(()=>{try{r.stop()}catch(e){}},seconds*1000);
}
